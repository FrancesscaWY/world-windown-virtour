<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#fbf5e9" />
    <meta name="description" content="欢迎来到深圳世界之窗。选择交互模式或伴游模式，让 AI 陪你探索园区里的世界风景。" />
    <title>世界之窗 · 深圳 · virtour</title>
    <link rel="icon" href="./assets/brand-favicon.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="./assets/brand-touch-icon.png" sizes="180x180" />
    <link rel="stylesheet" href="./assets/arrival/pages.css" />
    <link rel="stylesheet" href="./assets/arrival/transitions.css" />
    <link rel="stylesheet" href="./assets/arrival/flow.css" />
    <script src="./assets/arrival/transitions.js"></script>
    <link rel="prefetch" href="./modes.html" />
    <link rel="preload" as="image" href="./assets/arrival/welcome-guide.png" />
    <link rel="preload" as="image" href="./assets/arrival/welcome-landmarks.png" />
  </head>
  <body class="arrival arrival-welcome" data-page="welcome">
    <main class="welcome-page" id="welcome-page" aria-labelledby="welcome-title">
      <header class="arrival-masthead">
        <a class="arrival-brand" href="./index.html" aria-label="世界之窗 · 深圳 · virtour 首页"><img src="./assets/brand-logo.png" width="38" height="38" alt="VirTour 系统图标" /><span>世界之窗<span>深圳 · virtour</span></span></a>
        <span class="arrival-location">深圳 · 南山</span>
      </header>
      <section class="welcome-scene" aria-label="开启深圳世界之窗之旅">
        <img class="welcome-wash" src="./assets/arrival/welcome-background.png" width="1000" height="701" alt="" draggable="false" />
        <h1 class="welcome-title" id="welcome-title"><span class="welcome-title-main">世界之窗</span><span class="welcome-title-companion"><span>AI</span><span>伴游</span></span></h1>
        <div class="welcome-world">
          <div class="world-halo" aria-hidden="true"></div>
          <svg class="world-route" viewBox="0 0 500 520" fill="none" aria-hidden="true">
            <path class="world-route-line" d="M65 383C-16 227 159 81 328 139S524 361 366 429C259 475 112 470 65 383Z" pathLength="1" />
            <path class="world-route-dots" d="M65 383C-16 227 159 81 328 139S524 361 366 429C259 475 112 470 65 383Z" />
            <g class="world-plane"><path d="m355 119 40-12-17 38-6-17-17-9Z"/><path d="m372 128 23-21"/></g>
            <path class="world-star world-star-one" d="m72 210 3 10 10 3-10 3-3 10-3-10-10-3 10-3Z"/>
            <path class="world-star world-star-two" d="m416 344 2 7 7 2-7 2-2 7-2-7-7-2 7-2Z"/>
          </svg>
          <div class="world-ground" aria-hidden="true"></div>
          <img class="welcome-landmarks" src="./assets/arrival/welcome-landmarks.png" width="650" height="901" alt="水彩绘制的铁塔、凯旋门和世界建筑" fetchpriority="high" draggable="false" />
        </div>
        <div class="welcome-mascot">
          <span class="mascot-shadow" aria-hidden="true"></span>
          <button class="welcome-guide" type="button" aria-label="和沐沐打个招呼" title="点点我，打个招呼">
            <img src="./assets/arrival/welcome-guide.png" width="264" height="332" alt="沐沐戴着探险帽、围着绿色围巾，挥手欢迎你" fetchpriority="high" draggable="false" />
            <span class="mascot-spark mascot-spark-one" aria-hidden="true">✦</span><span class="mascot-spark mascot-spark-two" aria-hidden="true">✧</span>
          </button>
        </div>
        <span id="welcome-message" class="arrival-sr-only" aria-live="polite"></span>
      </section>
      <footer class="welcome-footer">
        <a class="welcome-enter" id="welcome-enter" data-swipe-link href="./modes.html" aria-label="左滑或点击，选择游览模式"><span class="welcome-invitation">左滑，出发</span><span class="welcome-arrow-disc" aria-hidden="true"><svg class="welcome-arrows" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="m15 5-7 7 7 7"/></svg></span></a>
        <nav class="arrival-progress" aria-label="欢迎与模式选择"><a class="is-current" href="./index.html" aria-label="欢迎页" aria-current="page"></a><a data-swipe-link href="./modes.html" aria-label="选择游览模式"></a></nav>
      </footer>
    </main>
    <script type="module" src="/src/welcome-page.js"></script>
  </body>
</html>
