name: VirTour
options:
  bundleIdPrefix: com.virtour
  deploymentTarget:
    iOS: "16.0"
targets:
  VirTour:
    type: application
    platform: iOS
    sources: [Sources]
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: 世界之窗伴游
        GuideBaseURL: https://v.direct.apricityx.top:55555
        UILaunchScreen: {}
        UIBackgroundModes: [audio, location]
        NSLocationWhenInUseUsageDescription: 根据园区内当前位置触发附近景点讲解。
        NSLocationAlwaysAndWhenInUseUsageDescription: 开启设备定位伴游后，锁屏时继续触发附近景点讲解。可随时在应用中停止。
        NSMicrophoneUsageDescription: 仅在你开启前台实时语音交流时使用麦克风。
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.virtour.guide
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
